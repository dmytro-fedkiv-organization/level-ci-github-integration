name: Level CI Accessibility Analysis

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Level CI reports
        uses: actions/upload-artifact@v4
        with:
          name: level-ci-reports
          path: ./level-ci-reports

  accessibility-analysis:
    runs-on: ubuntu-latest
    needs: e2e-tests
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository (Level CI config)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            level-ci.config.ts
            level-ci-github-integration.js
          sparse-checkout-cone-mode: false

      - name: Download Level CI reports
        uses: actions/download-artifact@v4
        with:
          name: level-ci-reports
          path: ./level-ci-reports

      - name: Publish accessibility check and PR comment
        run: node level-ci-github-integration.js
        env:
          LEVEL_CI_TOKEN: ${{ secrets.LEVEL_CI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.DMYTRO_FEDKIV_PAT }}
